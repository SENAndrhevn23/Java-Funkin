name: Build FNF JAVA ENGINE

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Compile Java
        run: |
          mkdir -p out
          find . -name "*.java" > sources.txt
          javac -cp ".:gson-2.10.1.jar:json-20231013.jar" -d out @sources.txt

      - name: Prepare fat jar folder
        run: |
          mkdir -p build

          # compiled classes
          cp -r out/* build/

          # assets (IMPORTANT: preserve structure)
          cp -r Assets build/
          cp -r Notes build/
          cp -r Source build/
          
      - name: Unpack dependencies into jar
        run: |
          cd build
          jar xf ../gson-2.10.1.jar || true
          jar xf ../json-20231013.jar || true
          cd ..

      - name: Create runnable JAR
        run: |
          echo "Main-Class: Main" > manifest.txt
          jar cfm FNF-JAVA-ENGINE.jar manifest.txt -C build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-JAVA-ENGINE
          path: FNF-JAVA-ENGINE.jar
