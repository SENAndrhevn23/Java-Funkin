- name: Build runnable JAR (FINAL FIX)
  run: |
    set -e

    rm -rf staging
    mkdir staging

    cp -r out/* staging/
    cp -r Assets staging/ || true
    cp -r Notes staging/ || true

    # IMPORTANT: correct manifest (double newline matters)
    printf "Manifest-Version: 1.0\nMain-Class: Main\n\n" > manifest.txt

    # build jar
    jar cfm FNF-JAVA-ENGINE.jar manifest.txt -C staging .

    # DEBUG: show manifest inside jar (THIS WILL CONFIRM FIX)
    jar xf FNF-JAVA-ENGINE.jar META-INF/MANIFEST.MF
    echo "===== MANIFEST INSIDE JAR ====="
    cat META-INF/MANIFEST.MF
