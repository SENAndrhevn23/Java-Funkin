- name: Build runnable JAR (HARD FIX)
  run: |
    set -e

    rm -rf staging
    mkdir staging

    cp -r out/* staging/
    cp -r Assets staging/ || true
    cp -r Notes staging/ || true

    # create MANIFEST (must be exact)
    mkdir -p manifest_dir/META-INF

    printf "Manifest-Version: 1.0\nMain-Class: Main\n\n" > manifest_dir/META-INF/MANIFEST.MF

    echo "=== MANIFEST CHECK ==="
    cat manifest_dir/META-INF/MANIFEST.MF

    # build JAR using MANIFEST DIRECTORY (this is the KEY FIX)
    jar cfm FNF-JAVA-ENGINE.jar manifest_dir/META-INF/MANIFEST.MF -C staging .

    # verify result
    echo "=== FINAL MANIFEST INSIDE JAR ==="
    jar xf FNF-JAVA-ENGINE.jar META-INF/MANIFEST.MF
    cat META-INF/MANIFEST.MF
